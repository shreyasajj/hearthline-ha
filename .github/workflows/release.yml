name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark this release as a preview (HACS users must enable beta versions)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Release CI gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m pytest -q
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python tools/package_integration.py
      - name: Validate HACS custom repository
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          comment: false
  publish:
    name: Publish tested HA release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Package the exact tested source and publish its version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          python tools/package_integration.py
          VERSION=$(python -c 'import json; print(json.load(open("custom_components/pixel_home/manifest.json"))["version"])')
          RELEASE_ARGS=()
          if [[ "$PRERELEASE" == "true" ]]; then RELEASE_ARGS+=(--prerelease); fi
          gh release create "v${VERSION}" dist/* --repo "$REPO" --target "$GITHUB_SHA" "${RELEASE_ARGS[@]}" --title "hearthline-ha ${VERSION}" --notes-file RELEASE-NOTES.md
