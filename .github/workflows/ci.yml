name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/hearthline-ha-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: HA config flow, endpoint, entity and automation tests
        run: python -m pytest -q
      - name: Display and provider regressions
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Compile integration and build checked installation archives
        run: |
          python -m compileall -q custom_components
          python tools/package_integration.py
      - name: Validate HACS custom repository
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          comment: false
