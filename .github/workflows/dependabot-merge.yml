name: Approve and merge passing Dependabot updates

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout or execution of pull-request code in this privileged workflow.
      - name: Verify CI and approve the tested Dependabot commit before merging
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time
          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True)
          def api(path):
              return json.loads(gh('api', path))
          repo=os.environ['REPO']
          run=api(f'repos/{repo}/actions/runs/{os.environ["RUN_ID"]}')
          if run['conclusion']!='success' or run['event'] not in ('pull_request','workflow_dispatch'):
              raise SystemExit('Not a successful CI run')
          if run['path']!='.github/workflows/ci.yml':
              raise SystemExit('Unexpected CI workflow')
          jobs=api(f'repos/{repo}/actions/runs/{run["id"]}/jobs?filter=latest')
          if not any(j['name']=='CI gate' and j['conclusion']=='success' for j in jobs['jobs']):
              raise SystemExit('Required CI gate did not succeed')
          # Dispatch runs can have an empty pull_requests array. Resolve the exact branch.
          from urllib.parse import urlencode
          query=urlencode({'head':repo.split('/')[0]+':'+run['head_branch'],'base':'main','state':'open'})
          for pr in api(f'repos/{repo}/pulls?{query}'):
              number=pr['number']
              if pr['user']['login']!='dependabot[bot]' or pr['draft']:
                  continue
              if pr['head']['repo']['full_name']!=repo or pr['head']['sha']!=run['head_sha']:
                  continue
              main=api(f'repos/{repo}/git/ref/heads/main')['object']['sha']
              compared=api(f'repos/{repo}/compare/{main}...{pr["head"]["sha"]}')
              if compared['merge_base_commit']['sha']!=main:
                  # Refresh on the server without checking out PR code. GITHUB_TOKEN-created
                  # commits do not trigger ordinary CI, so explicitly dispatch fresh CI.
                  gh('api','--method','PUT',f'repos/{repo}/pulls/{number}/update-branch',
                     '-f','expected_head_sha='+pr['head']['sha'])
                  for attempt in range(20):
                      updated=api(f'repos/{repo}/pulls/{number}')
                      if updated['head']['sha']!=pr['head']['sha']:
                          break
                      time.sleep(2)
                  else:
                      raise SystemExit('Branch update pending; no merge attempted')
                  gh('api','--method','POST',f'repos/{repo}/actions/workflows/ci.yml/dispatches',
                     '-f','ref='+pr['head']['ref'])
                  print(f'Refreshed Dependabot PR #{number}; fresh CI requested before merge')
                  continue
              reviews=api(f'repos/{repo}/pulls/{number}/reviews?per_page=100')
              already_approved=any(review['user']['login']=='github-actions[bot]'
                  and review['state']=='APPROVED' and review['commit_id']==pr['head']['sha']
                  for review in reviews)
              if not already_approved:
                  gh('api','--method','POST',f'repos/{repo}/pulls/{number}/reviews',
                     '-f','event=APPROVE','-f','commit_id='+pr['head']['sha'],
                     '-f','body=Automatically approved: the full CI gate, including HACS validation, passed for this exact Dependabot commit.')
              gh('pr','merge',str(number),'--repo',repo,'--squash','--match-head-commit',pr['head']['sha'])
              print(f'Merged passing Dependabot PR #{number}')
          PY
